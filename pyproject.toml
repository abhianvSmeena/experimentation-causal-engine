[project]
name = "experiment-toolkit"
version = "0.1.0"
description = "A tested toolkit for A/B test analysis and uplift modeling, with case studies on ASOS experiments and Criteo uplift data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Abhinav Singh Meena", email = "abhinav.m.iitkgp@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
case-studies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "econml>=0.15",
    "dowhy>=0.14",
    "tabulate>=0.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
abtest = "experiment_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
